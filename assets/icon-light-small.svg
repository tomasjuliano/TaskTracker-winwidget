<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="card-top-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F5F9"/>
    </linearGradient>

    <linearGradient id="check-front-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2589FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <linearGradient id="check-side-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0044CC"/>
      <stop offset="100%" stop-color="#002B80"/>
    </linearGradient>

    <filter id="shadow-base-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0a1d37" flood-opacity="0.12"/>
    </filter>

    <filter id="check-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#002266" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Tarjeta Base con Grosor 3D -->
  <rect x="32" y="44" width="448" height="448" rx="96" fill="#D0DCEB" filter="url(#shadow-base-light)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#card-top-light)"/>

  
  <!-- Checkmark 3D Volumétrico -->
  <g filter="url(#check-drop-shadow)">
    <path d="M 168 260 L 236 328 L 352 176" fill="none" stroke="url(#check-side-light)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 14)"/>
    <path d="M 168 260 L 236 328 L 352 176" fill="none" stroke="url(#check-side-light)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 7)"/>
    <path d="M 168 260 L 236 328 L 352 176" fill="none" stroke="url(#check-front-light)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
