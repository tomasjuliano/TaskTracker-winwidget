<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="card-top-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>

    <linearGradient id="check-front-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>

    <linearGradient id="check-side-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B88600"/>
      <stop offset="100%" stop-color="#7A5900"/>
    </linearGradient>

    <filter id="shadow-base-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="check-drop-shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Tarjeta Base con Grosor 3D -->
  <rect x="32" y="44" width="448" height="448" rx="96" fill="#08080A" filter="url(#shadow-base-dark)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#card-top-dark)"/>

  
  <!-- Checkmark 3D Volumétrico -->
  <g filter="url(#check-drop-shadow-dark)">
    <path d="M 168 260 L 236 328 L 352 176" fill="none" stroke="url(#check-side-dark)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 14)"/>
    <path d="M 168 260 L 236 328 L 352 176" fill="none" stroke="url(#check-side-dark)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 7)"/>
    <path d="M 168 260 L 236 328 L 352 176" fill="none" stroke="url(#check-front-dark)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
