name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install --upgrade pyinstaller

      - name: Compilar el ejecutable
        run: >
          pyinstaller
          --onefile
          --windowed
          --name TaskWidget
          --icon assets/icon.ico
          --collect-submodules tkinter
          task_widget.py

      - name: Verificar que se generó el .exe
        run: if (-not (Test-Path dist/TaskWidget.exe)) { throw "no se generó dist/TaskWidget.exe" }

      - name: Subir como artifact (toda build)
        uses: actions/upload-artifact@v4
        with:
          name: TaskWidget-windows
          path: dist/TaskWidget.exe
          if-no-files-found: error

      - name: Publicar Release (solo en tags vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ghArgs = @("dist/TaskWidget.exe", "--title", $tag, "--generate-notes")
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $hdr = $lines | Select-String "^## $([regex]::Escape($tag))\b" | Select-Object -First 1
            if ($hdr) {
              $rest = $lines[$hdr.LineNumber..($lines.Count - 1)]
              $next = $rest | Select-String "^## " | Select-Object -First 1
              $body = if ($next) { $rest[0..($next.LineNumber - 2)] } else { $rest }
              $notes = ($body -join "`n").Trim()
              if ($notes) { $ghArgs += @("--notes", $notes) }   # se antepone a las notas autogeneradas
            }
          }
          gh release create $tag @ghArgs
