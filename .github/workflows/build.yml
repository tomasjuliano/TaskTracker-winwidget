name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install --upgrade pyinstaller

      - name: Compilar el ejecutable
        run: >
          pyinstaller
          --onefile
          --windowed
          --name TaskWidget
          --collect-submodules tkinter
          task_widget.py

      - name: Verificar que se generó el .exe
        run: if (-not (Test-Path dist/TaskWidget.exe)) { throw "no se generó dist/TaskWidget.exe" }

      - name: Subir como artifact (toda build)
        uses: actions/upload-artifact@v4
        with:
          name: TaskWidget-windows
          path: dist/TaskWidget.exe
          if-no-files-found: error

      - name: Publicar Release (solo en tags vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/TaskWidget.exe"
          --title "${{ github.ref_name }}"
          --generate-notes
